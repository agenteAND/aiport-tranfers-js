schema: spec-driven

context: |
  MedusaJS 2.20.1 backend in a pnpm workspace for an airport-transfer MVP.
  Active SDD artifacts use hybrid persistence: conventional OpenSpec files and matching Engram observations.
  Application work follows strict test-driven development and uses pnpm test as the project verification command.

rules:
  proposal:
    - Define scope, dependencies, risks, success criteria, and rollback boundaries.
  specs:
    - Use RFC 2119 requirement keywords and Given/When/Then scenarios.
    - Keep each capability in its own active-change spec file.
  design:
    - Record architecture decisions, rationale, data flow, testing strategy, and rollout boundaries.
  tasks:
    - Group work by dependency-ordered phases with hierarchical numbering.
    - Keep RED, GREEN, and REFACTOR steps explicit and reviewable.
  apply:
    guidelines:
      - Preserve existing project patterns and implement only approved active-change tasks.
    tdd: true
    test_command: pnpm test
  verify:
    test_command: pnpm test
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas.
