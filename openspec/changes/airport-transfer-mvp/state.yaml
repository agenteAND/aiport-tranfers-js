product_decisions:
  status: confirmed
  authoritative: true
  confirmed:
    - Use Medusa Pricing Rules for the MVP fare mechanism, with validation for collisions and performance.
    - Include H3 from the start as the primary zone representation.
    - Use configurable H3 resolution, initially 9, validated with real PUJ-area addresses and boundary cases.
    - Handle price-changing reservation changes through an assisted operator flow in the MVP.
    - Use payment links for positive differences and refunds to the original method for negative differences, subject to provider capability.
    - Use change_request_id as the business-operation identity and provider_event_id to deduplicate provider webhooks.

